[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "securityops"
version = "0.1.0"
description = "SecurityOps - modulares Verwaltungsprogramm fuer Sicherheitsdienste"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=50,<51",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "holidays>=0.64,<1",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "pwdlib[argon2]>=0.2.1,<1",
  "pydantic-settings>=2.6,<3",
  "redis>=5,<7",
  "slowapi>=0.1.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.3,<10", "PyYAML>=6,<7"]
quality = ["ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI dependency declarations intentionally use Depends(...) in parameter defaults.
extend-ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The test-only password must be set before application modules are imported.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
