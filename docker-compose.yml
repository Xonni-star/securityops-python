services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securityops}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-securityops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Bitte POSTGRES_ADMIN_PASSWORD in .env setzen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav-debian:1.4.3@sha256:1d261f9c83ef2bbeef3915c7792f125e5707500fde0019d53547461747b90374
    restart: unless-stopped
    environment:
      CLAMD_CONF_TCPAddr: 0.0.0.0
      CLAMD_CONF_TCPSocket: "3310"
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 200M
      CLAMD_CONF_ReadTimeout: "120"
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "printf 'PING\\n' | nc -w 2 127.0.0.1 3310 | grep --quiet --line-regexp PONG && printf 'VERSION\\n' | nc -w 2 127.0.0.1 3310 | grep --extended-regexp --quiet '^ClamAV [0-9]+\\.[0-9]+\\.[0-9]+/[1-9][0-9]*/'",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30m

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-securityops}
      POSTGRES_USER: securityops_runtime
      POSTGRES_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Bitte POSTGRES_RUNTIME_PASSWORD in .env setzen}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      SESSION_COOKIE_SECURE: "true"
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.10}
      DOCUMENT_STORAGE_PATH: /var/lib/securityops/documents
      DOCUMENT_MAX_UPLOAD_BYTES: ${DOCUMENT_MAX_UPLOAD_BYTES:-20971520}
      MALWARE_SCANNER_HOST: clamav
      MALWARE_SCANNER_PORT: 3310
      MALWARE_SCANNER_TIMEOUT_SECONDS: ${MALWARE_SCANNER_TIMEOUT_SECONDS:-30}
      MALWARE_SCAN_MAX_BYTES: ${MALWARE_SCAN_MAX_BYTES:-104857600}
    volumes:
      - document_storage:/var/lib/securityops/documents
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  notification-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.notification_worker", "run"]
    environment:
      APP_ENV: production
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-securityops}
      POSTGRES_USER: securityops_runtime
      POSTGRES_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Bitte POSTGRES_RUNTIME_PASSWORD in .env setzen}
      SESSION_COOKIE_SECURE: "true"
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.10}
      NOTIFICATION_WORKER_POLL_SECONDS: ${NOTIFICATION_WORKER_POLL_SECONDS:-2}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-25}
      NOTIFICATION_WORKER_LEASE_SECONDS: ${NOTIFICATION_WORKER_LEASE_SECONDS:-300}
      NOTIFICATION_WORKER_MAX_ATTEMPTS: ${NOTIFICATION_WORKER_MAX_ATTEMPTS:-8}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      test: ["CMD", "python", "-m", "app.notification_worker", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    build: ./backend
    profiles: ["release"]
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-securityops}
      POSTGRES_USER: securityops_migrator
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Bitte POSTGRES_MIGRATION_PASSWORD in .env setzen}
    depends_on:
      db:
        condition: service_healthy
      provision-db:
        condition: service_completed_successfully
    networks:
      - app
      - data

  provision-db:
    build: ./backend
    profiles: ["release"]
    command: ["python", "-m", "scripts.provision_database_roles"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-securityops}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-securityops_admin}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Bitte POSTGRES_ADMIN_PASSWORD in .env setzen}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Bitte POSTGRES_MIGRATION_PASSWORD in .env setzen}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Bitte POSTGRES_RUNTIME_PASSWORD in .env setzen}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  restore-documents:
    build: ./backend
    profiles: ["restore-test"]
    command:
      [
        "sh",
        "-ec",
        "test -z \"$(ls -A /var/lib/securityops/documents)\" && tar -C /var/lib/securityops/documents -xf -",
      ]
    volumes:
      - restore_test_documents:/var/lib/securityops/documents
    network_mode: none

  backup-documents:
    build: ./backend
    profiles: ["backup"]
    command: ["tar", "-C", "/var/lib/securityops/documents", "-cf", "-", "."]
    volumes:
      - document_storage:/var/lib/securityops/documents
    network_mode: none

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      app:
        ipv4_address: ${APP_FRONTEND_IP:-172.28.0.10}

volumes:
  postgres_data:
  document_storage:
  restore_test_documents:

networks:
  app:
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.28.0.0/24}
  data:
    internal: true
